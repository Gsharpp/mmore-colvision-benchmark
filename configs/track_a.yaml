# Track A — visual document retrieval on ViDoRe v2 (biomedical lectures).
# Adopted, published benchmark: figure-rich lecture slides with human-validated,
# vision-grounded queries and graded multi-page relevance (qrels). This replaces
# the earlier home-grown PMC-OA scaling study, whose text-dense corpus and
# text-grounded queries structurally favoured text retrieval over ColVision.

corpus:
  source: "vidore"
  dataset: "vidore/biomedical_lectures_eng_v2"
  language: "en"

# ViDoRe is a fixed evaluation set (not a scaling sweep): a single "palier"
# covering the whole corpus. The orchestrator reads {queries_dir}/full.jsonl and
# the graded qrels sidecar {queries_dir}/full.qrels.json.
scaling_paliers:
  - id: full
    n_pages: 1016

queries:
  per_palier:
    full: 160

retrieval:
  top_k: 10

seeds: [0]

# Filesystem layout used by bcv-run track-a. All paths are relative to the
# repo root unless absolute. The runner derives per-palier paths from
# {queries_dir}/{palier_id}.jsonl, {mmore_output_dir}/{model_id}/{palier_id}/
# and writes one BenchmarkRecord JSON to
# {records_dir}/{model_id}/{palier_id}/seed_{seed}.json.
paths:
  corpus_manifest: data/track_a/corpus_manifest.json
  queries_dir: data/track_a/queries
  mmore_process_config: configs/mmore/process.yaml
  mmore_index_config: configs/mmore/index.yaml
  mmore_retrieve_config: configs/mmore/retrieve.yaml
  mmore_output_dir: data/track_a/retrieve
  records_dir: results/track_a
