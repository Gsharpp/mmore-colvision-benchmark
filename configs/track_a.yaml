# Track A — main benchmark on English medical PDFs with figures.
# Scaling study: same model evaluated at increasing corpus sizes.

corpus:
  language: "en"
  source: "pmc-oa"
  visual_density_threshold: 0.30
  mesh_filter:
    include_top_level: ["A", "C", "E"]   # Anatomy, Diseases, Analytical & Diagnostic Techniques

scaling_paliers:
  - id: tiny
    n_pages: 100
  - id: small
    n_pages: 1000
  - id: medium
    n_pages: 10000
  - id: large
    n_pages: 50000

queries:
  per_palier:
    tiny: 50
    small: 200
    medium: 500
    large: 1500

retrieval:
  top_k: 10

seeds: [0, 1, 2]

# Filesystem layout used by bcv-run track-a. All paths are relative to the
# repo root unless absolute. The runner derives per-palier paths from
# {queries_dir}/{palier_id}.jsonl, {mmore_output_dir}/{model_id}/{palier_id}/
# and writes one BenchmarkRecord JSON to
# {records_dir}/{model_id}/{palier_id}/seed_{seed}.json.
paths:
  corpus_manifest: data/track_a/corpus_manifest.json
  queries_dir: data/track_a/queries
  mmore_process_config: configs/mmore/process.yaml
  mmore_index_config: configs/mmore/index.yaml
  mmore_retrieve_config: configs/mmore/retrieve.yaml
  mmore_output_dir: data/track_a/retrieve
  records_dir: results/track_a
