# LLM judge configuration — Meditron-70B served via vLLM on RCP.

judge:
  hf_name: "epfl-llm/meditron-70b"
  served_via: "vllm"
  vllm:
    tensor_parallel_size: 4    # split across 4 GPUs on RCP
    max_model_len: 4096
    dtype: "bfloat16"
  sampling:
    temperature: 0.0
    max_tokens: 512

# Generator (for the RAG answer the judge will evaluate).
generator:
  hf_name: "epfl-llm/meditron-7b"
  served_via: "vllm"
  vllm:
    tensor_parallel_size: 1
    max_model_len: 4096
    dtype: "bfloat16"
  sampling:
    temperature: 0.0
    max_tokens: 512

# Query generator (used in Phase 3 to author the synthetic Q&A dataset).
query_generator:
  hf_name: "epfl-llm/meditron-70b"
  served_via: "vllm"
  sampling:
    temperature: 0.7
    max_tokens: 256
  ambiguity_check:
    enabled: true
    threshold: 0.8
