# ColVision models under benchmark.
# Each entry follows the mmore model_utils.py registry naming.

models:
  - id: colpali_v1_3
    hf_name: "vidore/colpali-v1.3"
    family: "ColPali"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 8
    pdf_dpi: 200

  - id: colqwen2_v1_0
    hf_name: "vidore/colqwen2-v1.0"
    family: "ColQwen2"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 8
    pdf_dpi: 200

  - id: colqwen2_5_v0_2
    hf_name: "vidore/colqwen2.5-v0.2"
    family: "ColQwen2.5"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 8
    pdf_dpi: 200

  - id: colgemma3_colnetra
    hf_name: "Cognitive-Lab/ColNetraEmbed"
    family: "ColGemma3"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 8
    pdf_dpi: 200

  # ColSmol (ColIdefics3) — small SmolVLM-based ColVision models, added to the
  # mmore registry in 4102f96. Both checkpoints route to the `ColIdefics3` /
  # `ColIdefics3Processor` classes (colpali-engine). As the lightest models in
  # the suite they anchor the low end of the size range.
  # embed_dim assumed 128 (ColIdefics3 default) — confirm at first tiny run via
  # scripts/rcp/debug/diag_models.py (mmore also auto-detects the dim since 4985600).
  - id: colsmol_256m
    hf_name: "vidore/colSmol-256M"
    family: "ColSmol"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 16   # very light → larger batch
    pdf_dpi: 200

  - id: colsmol_500m
    hf_name: "vidore/colSmol-500M"
    family: "ColSmol"
    embed_dim: 128
    dtype: "bfloat16"
    process_batch_size: 12
    pdf_dpi: 200
